<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening…</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.4 -apple-system, system-ui, sans-serif; background: #fff; color: #00121d; }
  @media (prefers-color-scheme: dark) { body { background: #00121d; color: #fff; } }
  main { padding: 24px; text-align: center; max-width: 360px; }
  a.btn { display: inline-block; margin-top: 16px; padding: 14px 22px; border-radius: 999px; background: #EB7100; color: #fff; font-weight: 600; text-decoration: none; }
  p { opacity: .7; }
</style>
</head>
<body>
<main>
  <div id="msg">Opening…</div>
  <a id="go" class="btn" href="#" hidden>Open</a>
  <p id="hint" hidden>If nothing happened, tap the button.</p>
</main>
<script>
// Bridge for the PapeX Notebook (it runs inside Claude, which can't open
// sms: or ms-outlook:// links itself). Everything rides in the URL #fragment,
// so the phone number and message are never sent to whatever server hosts this page.
// Only fixed destinations are allowed (Messages, WhatsApp, Outlook, the share sheet), so this can't be used as an open redirect.
(function () {
  // Reused tab with a new #fragment: start fresh so the button never points at the previous contact.
  addEventListener("hashchange", function () { location.reload(); });
  // Parse the fragment by hand: URLSearchParams would turn "+" into a space and drop "+44" country codes.
  // The Notebook builds every value with encodeURIComponent, so "+" arrives as %2B.
  var q = {};
  location.hash.slice(1).split("&").forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf("="), k = i < 0 ? kv : kv.slice(0, i), v = i < 0 ? "" : kv.slice(i + 1);
    try { q[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) {}
  });
  q.get = function (k) { return Object.prototype.hasOwnProperty.call(q, k) ? q[k] : null; };
  var app = q.get("app");
  // iPads report themselves as Macs; a touch screen gives them away. iOS wants "&body=", others "?body=".
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var url = null, label = "";
  if (app === "sms") {
    var to = (q.get("to") || "").replace(/[^\d+]/g, "").slice(0, 20);
    var body = (q.get("body") || "").slice(0, 20000);
    url = "sms:" + to + (body ? (ios ? "&" : "?") + "body=" + encodeURIComponent(body) : "");
    label = "Open Messages";
  } else if (app === "whatsapp") {
    var wto = (q.get("to") || "").replace(/[^\d]/g, "").slice(0, 20);
    var wbody = (q.get("body") || "").slice(0, 20000);
    if (wto) {
      url = "https://wa.me/" + wto + (wbody ? "?text=" + encodeURIComponent(wbody) : "");
      label = "Open WhatsApp";
    }
  } else if (app === "share") {
    // Apple's share sheet needs a tap on this page, so show one big button.
    var stext = (q.get("body") || "").slice(0, 20000), stitle = (q.get("title") || "").slice(0, 200);
    if (stext) {
      var m0 = document.getElementById("msg"), b0 = document.getElementById("go");
      m0.textContent = "Ready to share";
      b0.textContent = "Share"; b0.href = "#"; b0.hidden = false;
      b0.addEventListener("click", function (ev) {
        ev.preventDefault();
        var data = { text: stext }; if (stitle) data.title = stitle;
        if (navigator.share) { navigator.share(data).then(function () { m0.textContent = "Shared. You can close this tab."; }).catch(function (e) { if (e && e.name === "AbortError") return; copyIt(); }); }
        else copyIt();
      });
      function copyIt() {
        var done = function () { m0.textContent = "Copied. Paste it wherever you want to send it."; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(stext).then(done, function () { m0.textContent = "Couldn't open the share menu here."; });
        else m0.textContent = "Couldn't open the share menu here.";
      }
      return;
    }
  } else if (app === "outlook") {
    url = "ms-outlook://";
    label = "Open Outlook";
  }
  var msg = document.getElementById("msg"), go = document.getElementById("go"), hint = document.getElementById("hint");
  if (!url) { msg.textContent = "Nothing to open."; return; }
  msg.textContent = label + "…";
  go.textContent = label; go.href = url; go.hidden = false;
  setTimeout(function () { hint.hidden = false; }, 1200);
  location.href = url; // works on most phones; the button covers the rest
})();
</script>
</body>
</html>
